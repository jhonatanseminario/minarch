backend = "glx";
vsync = true;

shadow = true;
shadow-color = "#808080";
shadow-radius = 2;
shadow-offset-x = -2;
shadow-offset-y = -2;

blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;

rules: ({
  match = "override_redirect = true";
  shadow = false;
},
  {
    match = "class_g != 'dwm'";
    blur-background = false;
})
